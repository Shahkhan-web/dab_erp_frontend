<div class="space-y-4">
  <div
    class="relative overflow-hidden rounded-xl border-2 border-dashed transition-all"
    [ngClass]="uploadDragActive ? 'border-primary bg-primary-500-5' : 'border-zinc-300 dark:border-zinc-600'"
    (dragenter)="onUploadDragEnter($event)"
    (dragleave)="onUploadDragLeave($event)"
    (dragover)="onUploadDragOver($event)"
    (drop)="onUploadDrop($event)">
    <div class="flex flex-col items-center justify-center gap-2 text-center py-8 px-4">
      <mat-icon class="icon-size-10 text-primary" [svgIcon]="'heroicons_outline:arrow-up-tray'"></mat-icon>
      <p class="text-sm font-medium">Drop files here or</p>
      <button mat-stroked-button color="primary" type="button" (click)="fileInput.click()">Browse files</button>
      <input #fileInput type="file" class="sr-only" multiple [accept]="acceptAttr" (change)="onFileInputChange($event)" />
      <p class="text-xs text-secondary">Optional · PDF, JPEG, PNG, WebP, GIF · max 15 MB each</p>
    </div>
  </div>

  @if (pendingItems.length) {
    <div class="rounded-xl border p-4 space-y-3">
      <div class="flex justify-between items-center">
        <span class="text-sm font-medium">Attachments ({{ pendingItems.length }})</span>
        <button mat-stroked-button type="button" (click)="clearPending()">Clear all</button>
      </div>
      @for (item of pendingItems; track trackByPendingId($index, item)) {
        <div class="flex gap-2 items-center">
          <mat-form-field class="fuse-mat-dense flex-1">
            <mat-label>Display name</mat-label>
            <input matInput [(ngModel)]="item.displayName" />
          </mat-form-field>
          <button mat-icon-button type="button" color="warn" (click)="removePendingItem(item)">
            <mat-icon class="icon-size-5">close</mat-icon>
          </button>
        </div>
      }
    </div>
  }
</div>
