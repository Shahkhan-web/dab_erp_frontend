<div class="rounded-2xl bg-white dark:bg-zinc-900 p-6 sm:p-7 max-w-md">
  <h2 class="text-lg font-bold tracking-tight text-neutral-900 dark:text-white">{{ title }}</h2>
  <p class="mt-2 text-sm text-secondary">
    This company has a letterhead on file. Choose whether to include it on the PDF before it is generated.
  </p>
  <mat-checkbox class="mt-4 block" [(ngModel)]="includeLetterhead">
    Include company letterhead
  </mat-checkbox>
  <div class="mt-6 flex flex-wrap justify-end gap-2">
    <button mat-stroked-button type="button" (click)="cancel()">Cancel</button>
    <button mat-flat-button color="primary" type="button" (click)="confirm()">Continue</button>
  </div>
</div>
