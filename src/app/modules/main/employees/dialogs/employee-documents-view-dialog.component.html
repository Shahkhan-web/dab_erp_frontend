<div class="print-dialog-content bg-white dark:bg-zinc-900 rounded-2xl overflow-hidden">
  <div class="bg-gradient-to-r from-primary-600 to-primary-700 px-6 py-5 text-white">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3 min-w-0">
        <div class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-xl bg-white/20">
          <mat-icon class="icon-size-8 text-white" [svgIcon]="'heroicons_outline:document-text'"></mat-icon>
        </div>
        <div class="min-w-0">
          <h2 class="text-xl font-bold tracking-tight">Documents</h2>
          <p class="text-sm text-white/90 truncate">
            {{ data.employeeName ? 'Files for ' + data.employeeName : 'Uploaded files' }}
          </p>
        </div>
      </div>
      <button mat-icon-button type="button" (click)="close()" class="text-white/90 hover:bg-white/20 flex-shrink-0">
        <mat-icon class="text-white">close</mat-icon>
      </button>
    </div>
  </div>

  <div class="p-6 sm:p-8">
    <div *ngIf="loading" class="flex justify-center py-16">
      <mat-progress-spinner mode="indeterminate" diameter="40"></mat-progress-spinner>
    </div>

    <ng-container *ngIf="!loading">
      <h3 class="text-sm font-semibold uppercase tracking-wide text-secondary mb-3">Uploaded documents</h3>
      <ul *ngIf="extraDocuments.length" class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <li
          *ngFor="let doc of extraDocuments"
          class="flex gap-3 rounded-xl border border-zinc-200 bg-white p-3 shadow-sm dark:border-zinc-600 dark:bg-zinc-900/50">
          <button
            type="button"
            class="relative flex h-14 w-14 flex-shrink-0 items-center justify-center overflow-hidden rounded-lg bg-zinc-100 dark:bg-zinc-800"
            [disabled]="!doc.url"
            [matTooltip]="doc.url ? 'Open in new tab' : 'No file link'"
            (click)="openExtraDoc(doc)">
            <img
              *ngIf="doc.url && isImageExtraDoc(doc)"
              [src]="doc.url"
              alt=""
              class="h-full w-full object-cover" />
            <mat-icon
              *ngIf="!doc.url || !isImageExtraDoc(doc)"
              class="icon-size-7 text-zinc-500"
              [svgIcon]="extraDocIconSvg(doc)"></mat-icon>
          </button>
          <div class="min-w-0 flex-1 flex flex-col justify-center">
            <p class="truncate font-medium text-zinc-900 dark:text-zinc-100">{{ doc.displayName }}</p>
            <p *ngIf="doc.createdAt" class="text-xs text-secondary">{{ doc.createdAt | date : 'mediumDate' }}</p>
            <button
              *ngIf="doc.url"
              type="button"
              class="mt-1 text-left text-sm text-primary-600 dark:text-primary-400 hover:underline bg-transparent border-0 p-0 cursor-pointer"
              (click)="openExtraDoc(doc)">
              Open file
            </button>
          </div>
        </li>
      </ul>
      <p *ngIf="!extraDocuments.length" class="text-sm text-secondary py-4">
        No uploaded documents yet. You can add files from the employee form (extra documents step).
      </p>
    </ng-container>

    <div class="mt-8 flex flex-wrap gap-3 justify-end">
      <button mat-stroked-button type="button" (click)="close()">Close</button>
    </div>
  </div>
</div>
